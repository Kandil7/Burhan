# HistoryCollectionAgent behavior record (hardening Phase 5).
# Every value here matches what the agent does at runtime; the
# equivalence test in tests/test_agent_spec_equivalence.py guards it.
name: history
collection: islamic_history_passages
intent: ISLAMIC_HISTORY
generation:
  temperature: 0.25
  max_tokens: 1024
  system_prompt_file: prompts/history_agent.txt
  system_prompt_fallback: 'أنت متخصص في التاريخ الإسلامي.

    استند فقط إلى النصوص التاريخية.

    Use مراجع المصادر [C1]، [C2].'
  system_prompt_fallback_includes_preamble: false
  user_prompt_template: 'السؤال التاريخي: {query}

    اللغة المطلوبة: {language}

    النصوص التاريخية:

    {passages}

    قدم الإجابة مع الترتيب الزمني.'
  no_passages_message: لم أجد معلومات تاريخية كافية.
retrieval:
  top_k: 12
  score_threshold: 0.5
  rerank: true
  dense_weight: 0.6
  sparse_weight: 0.4
passages:
  header: '[C{index}] {content}'
  truncate: 500
verification:
  fail_fast: true
  checks:
  - name: source_attributor
    fail_policy: warn
    enabled: true
    stage: answer
fallback:
  strategy: chatbot
